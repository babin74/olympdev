[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "olympdev"
authors = [ { name = "Aleksandr Babin", email = "srbabin@yandex.ru" } ]
version = "0.0.1"
description = "OlympDev: contest problem tooling"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10,<3",
    # `statement` and `--html` are core CLI commands, and both render through
    # jinja2. The view models themselves never import it, so a report still
    # prints from plain text - see olympdev/frontend/view.py.
    "jinja2>=3.1.2,<4",
]
license = "MIT"
license-files = ["LICENSE"]

# The notebook facade: rich display and widgets. Everything the CLI prints,
# including HTML reports and statements, works without this extra.
[project.optional-dependencies]
notebook = [
    "ipython>=8",
]

[project.scripts]
olympdev = "olympdev.frontend.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["olympdev*"]

[tool.setuptools.package-data]
olympdev = ["assets/**/*"]
"olympdev.frontend.html" = ["templates/**/*"]

[tool.pytest.ini_options]
# Tests are plain functions; without this pytest tries to collect view models
# whose names start with "Test" (TestRowView, TestingReportView).
python_classes = []
markers = [
    "slow: tests that run isolate or compile inside a sandbox",
    "attack: adversarial payloads; skipped unless --run-attacks is passed",
]
