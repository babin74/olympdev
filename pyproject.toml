[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "olympdev"
authors = [ { name = "Aleksandr Babin", email = "srbabin@yandex.ru" } ]
version = "0.0.1"
description = "OlympDev: contest problem tooling"
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1.2,<4",
    "pydantic>=2.10,<3",
]

license = "MIT"
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
olympdev = ["assets/**/*", "frontend/html/templates/**/*"]

[tool.pytest.ini_options]
markers = [
    "slow: tests that run isolate or compile inside a sandbox",
]